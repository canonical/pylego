name: Publish Python Package

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-wheel:
    strategy:
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.2.0
        with:
          workflows-ref: v3.2.0

      - name: Set up Go and Python toolchains
        uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.2.0
        with:
          toolchains: go python
          go-version: latest

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.runner }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.2.0
        with:
          workflows-ref: v3.2.0

      - name: Set up Python toolchain
        uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.2.0
        with:
          toolchains: python

      - name: Build source distribution
        run: uv build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  upload-package:
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python toolchain
        uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.2.0
        with:
          toolchains: python

      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set +e
          OUTPUT=$(uv publish dist/* 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "File already exists"; then
              echo "Package version already exists. Skipping further steps."
              exit 0
            fi
            exit "$STATUS"
          fi
