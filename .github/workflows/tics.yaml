name: TiCS Static Analysis

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 am
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  analyze:
    runs-on: [self-hosted, linux, amd64, tiobe, jammy]
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        run: |
          sudo snap install go --classic --channel=1.24/stable
          echo "/snap/bin" >> "$GITHUB_PATH"
          go version
      - name: Install dependencies
        run: |
          sudo snap install --classic astral-uv
          sudo apt-get install -y python3-pytest
          uv venv
          uv pip install pytest pytest-cov pylint ruff
      - name: Build lego shared library
        run: |
          cd src/pylego
          go build -o lego.so -buildmode=c-shared lego.go
      - name: Generate code coverage
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest tests/unit --cov=src --cov-report=xml:coverage.xml || true
      - name: Move results to necessary folder for TICS
        run: |
          mkdir -p .cover
          if [ -f coverage.xml ]; then mv coverage.xml .cover/coverage.xml; fi
          ls -l .cover/ || echo ".cover/ is empty or missing"
      - name: Run TICS analysis
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: pylego
          branchdir: .
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=GoProjects
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true