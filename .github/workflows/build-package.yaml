name: Test building the package
on:
    workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
    - name: checkout
      uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.2.0
      with:
        workflows-ref: v3.2.0
    - name: Set up Go and Python toolchains
      uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.2.0
      with:
        toolchains: go python
        go-version: latest
    - name: Build wheel
      run: uv build --wheel
