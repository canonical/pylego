name: Main workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ignore-main-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref_name) }}
  cancel-in-progress: true

jobs:
  test-package:
    uses: ./.github/workflows/test-package.yaml
  test-build:
    uses: ./.github/workflows/build-package.yaml
  upload-package:
    needs:
      - test-package
      - test-build
    if: ${{ github.ref_name == 'main' && contains(github.event.head_commit.modified, 'src/') }}
    uses: ./.github/workflows/upload.yaml
    secrets: inherit
